name: Supabase keep-alive

# Supabase ücretsiz planı 7 gün az kullanılan projeyi duraklatıyor.
# Uygulamanın boşta kaldığı dönemlerde (tatil vb.) proje durmasın diye
# her gün veritabanına küçük bir sorgu atılır. Anon anahtarla RLS satır
# döndürmez ([]) ama sorgu Postgres'te çalıştığı için aktivite sayılır.

on:
  schedule:
    - cron: '0 6 * * *' # her gün 06:00 UTC (09:00 TR)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e sorgu at
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
